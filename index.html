<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
  >

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Verificando sessão...
  </title>

  <!-- Favicon padrão -->
  <link
    rel="icon"
    type="image/png"
    href="./favicon.png"
  >

  <!-- Compatibilidade Apple / iOS -->
  <link
    rel="apple-touch-icon"
    href="./favicon.png"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4f5f7;
      color:#50514F;
    }

    .card{
      background:#fff;
      padding:28px 34px;
      border-radius:16px;
      box-shadow:0 18px 45px rgba(0,0,0,0.10);
      text-align:center;
      border:1px solid #e5e7eb;
      max-width:360px;
      width:calc(100% - 32px);
    }

    .loader{
      width:34px;
      height:34px;
      border-radius:50%;
      border:4px solid #e5e7eb;
      border-top-color:#007E7A;
      animation:spin 1s linear infinite;
      margin:0 auto 14px;
    }

    .card h1{
      font-size:18px;
      color:#007E7A;
      margin-bottom:6px;
    }

    .card p{
      font-size:14px;
      color:#6b7280;
      line-height:1.4;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    noscript{
      position:fixed;
      bottom:12px;
      left:0;
      right:0;
      text-align:center;
      font-size:14px;
      color:#b91c1c;
      padding:0 16px;
    }

  </style>

</head>

<body>

  <div class="card">

    <div class="loader"></div>

    <h1 id="tituloStatus">
      Verificando sessão...
    </h1>

    <p id="textoStatus">
      Aguarde, estamos abrindo o sistema.
    </p>

  </div>

  <noscript>
    Ative o JavaScript para continuar.
  </noscript>

  <script type="module">

    import {
      protegerPagina
    } from "./authGuard.js";

    const PAGINA_DASHBOARD =
    "./dashboard.html";

    const tituloStatus =
    document.getElementById("tituloStatus");

    const textoStatus =
    document.getElementById("textoStatus");

    async function iniciar() {

      try {

        if (tituloStatus) {

          tituloStatus.textContent =
          "Verificando acesso...";

        }

        if (textoStatus) {

          textoStatus.textContent =
          "Validando usuário, status e permissões.";

        }

        await protegerPagina();

        document.title =
        "Abrindo dashboard...";

        if (tituloStatus) {

          tituloStatus.textContent =
          "Acesso autorizado";

        }

        if (textoStatus) {

          textoStatus.textContent =
          "Abrindo o painel executivo.";

        }

        window.location.replace(
          PAGINA_DASHBOARD
        );

      } catch (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );

        if (tituloStatus) {

          tituloStatus.textContent =
          "Falha ao verificar sessão";

        }

        if (textoStatus) {

          textoStatus.textContent =
          "Redirecionando para a tela de login.";

        }

      }

    }

    iniciar();

  </script>

</body>

</html>
